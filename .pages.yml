# Pages CMS 설정 (pagescms.org) — GitHub 로그인 후 폼 기반 관리자 화면 제공
# 저장 = 커밋 = Cloudflare 자동 배포 (몇 분 뒤 사이트 반영)

# 업로드 폴더는 public/ 아래여야 한다 — 정적 내보내기(out/)에 포함되어야
# 본문에 넣은 사진이 배포 사이트에서 열린다
media:
  input: public/uploads
  output: /uploads

content:
  - name: projects
    label: 프로젝트
    type: collection
    path: content/projects
    extension: mdx
    format: yaml-frontmatter
    view:
      fields: [title, status, date, featured]
    fields:
      - name: title
        label: 이름
        type: string
        required: true
      - name: description
        label: 한 줄 설명
        type: string
        required: true
      - name: thumbnail
        label: 썸네일
        type: image
        description: "앱 스크린샷을 올리면 빌드가 웜톤 4:3 프레임을 자동으로 입혀 카드에 보여준다 (원본 비율·크기는 상관없음)"
        required: true
      - name: liveUrl
        label: 서비스 링크
        type: string
        required: true
      - name: repoUrl
        label: GitHub 링크 (선택)
        type: string
      - name: ctaText
        label: CTA 버튼 문구 (선택, 기본 "사용해보기")
        type: string
      - name: status
        label: 상태
        type: select
        options:
          values: [live, beta, archived]
        required: true
      - name: tags
        label: 태그
        type: string
        list: true
      - name: date
        label: 날짜
        type: date
        required: true
      - name: featured
        label: 홈 Featured 노출
        type: boolean
      - name: privacy
        label: 개인정보 처리 안내 (상세 페이지 하단 표)
        type: object
        description: "교육부 「학습지원 소프트웨어 선정 기준」의 필수기준 항목. 비워두면 표가 표시되지 않는다"
        fields:
          - name: collects
            label: 수집 항목
            type: string
            list: true
          - name: storage
            label: 저장 위치
            type: string
          - name: storageNote
            label: 저장 방식 (안전조치)
            type: string
          - name: retention
            label: 보관·파기
            type: string
          - name: rights
            label: 열람·정정·삭제 방법
            type: string
          - name: thirdParty
            label: 제3자 제공·위탁
            type: string
          - name: under14
            label: 만 14세 미만 아동 처리
            type: string
          - name: policyUrl
            label: 앱 개인정보 처리방침 링크 (선택)
            type: string
      - name: body
        label: 본문 (MDX — SectionTitle/FeatureGrid/Feature 구조를 유지하며 문구만 수정 권장)
        type: text

  - name: site
    label: 사이트 문구
    type: file
    path: content/site.json
    fields:
      - name: siteName
        label: 사이트 이름
        type: string
      - name: operatorName
        label: 운영자명 (저작권 표기)
        type: string
      - name: siteDescription
        label: 사이트 설명 (검색·공유 미리보기)
        type: string
      - name: contactEmail
        label: 연락 이메일
        type: string
      - name: heroTagline
        label: 홈 태그라인 (분홍 알약)
        type: string
      - name: heroTitle
        label: 홈 큰 제목
        type: string
      - name: heroSubtitle
        label: 홈 부가 문장
        type: string
      - name: heroQuote
        label: 홈 하단 글귀 (비우면 표시 안 함)
        type: string
      - name: heroQuoteSource
        label: 홈 하단 글귀 출처
        type: string
      - name: heroImage
        label: 홈 히어로 이미지
        type: image
        description: "홈 상단 큰 배경 그림. 가로로 긴 이미지가 잘 맞는다 (글자는 왼쪽에 얹힘)"
      - name: heroImageAlt
        label: 홈 히어로 이미지 설명 (대체 텍스트)
        type: string
        description: "그림이 안 보이는 환경·스크린리더에서 읽히는 설명. 이미지를 바꾸면 같이 고칠 것"
      - name: privacyNotice
        label: 개인정보 섹션 안내 문구
        type: text
        description: "프로젝트 상세의 개인정보 표 위에 공통으로 뜨는 문구. 학운위 심의 대상 여부를 단정하지 않도록 유지할 것"
      - name: aboutDescription
        label: About 페이지 설명 (검색·공유 미리보기)
        type: string
      - name: aboutParagraphs
        label: About 소개 문단
        type: text
        list: true
