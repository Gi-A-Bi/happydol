# Pages CMS 설정 (pagescms.org) — GitHub 로그인 후 폼 기반 관리자 화면 제공
# 저장 = 커밋 = Cloudflare 자동 배포 (몇 분 뒤 사이트 반영)

media:
  input: assets/screenshots
  output: /assets/screenshots

content:
  - name: projects
    label: 프로젝트
    type: collection
    path: content/projects
    extension: mdx
    format: yaml-frontmatter
    # 파일명(slug)이 URL(/projects/<slug>)과 썸네일 이름이 된다 — 영문 소문자·하이픈만 사용
    view:
      primary: title
      fields: [title, status, date, featured]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 이름
        type: string
        required: true
      - name: description
        label: 한 줄 설명
        type: string
        required: true
      - name: thumbnail
        label: 썸네일 경로
        type: string
        description: "/thumbnails/<파일이름>.png — assets/screenshots에 <파일이름>.png 스크린샷을 올리면 빌드가 프레임 썸네일을 자동 생성"
        required: true
      - name: liveUrl
        label: 서비스 링크
        type: string
        required: true
      - name: repoUrl
        label: GitHub 링크 (선택)
        type: string
      - name: ctaText
        label: CTA 버튼 문구 (선택, 기본 "사용해보기")
        type: string
      - name: status
        label: 상태
        type: select
        default: live
        options:
          values: [live, beta, archived]
        required: true
      - name: tags
        label: 태그
        type: string
        list: true
      - name: date
        label: 날짜
        type: date
        required: true
      - name: featured
        label: 홈 Featured 노출
        type: boolean
        default: false
      # 본문은 기존 게시물과 같은 구조(문제 → 해결 → 기능 카드 → 마무리 문장)로 작성.
      # 새 글은 아래 템플릿이 채워진 상태로 열리므로 문구만 바꾸면 된다.
      - name: body
        label: 본문
        description: "구조: <SectionTitle label=\"problem\">문제 요약</SectionTitle> → 설명 문단 → <SectionTitle label=\"solution\">해결 요약</SectionTitle> → 설명 문단 → <SectionTitle label=\"features\">기능 요약</SectionTitle> → <FeatureGrid> 안에 <Feature icon=\"이모지\" title=\"기능명\">한 줄 설명</Feature> 반복 → (선택) 마무리 문단. 태그 이름은 그대로 두고 문구만 수정하세요."
        type: code
        options:
          format: mdx
        default: |
          <SectionTitle label="problem">아이들과 교실에서 겪는 불편을 한 문장으로</SectionTitle>

          어떤 상황에서, 무엇이 번거롭거나 어려운지 2~3문장으로 적습니다.

          <SectionTitle label="solution">이 앱이 그 문제를 어떻게 풀어주는지 한 문장으로</SectionTitle>

          앱이 하는 일과 사용 흐름을 2~3문장으로 적습니다. 무료 여부, 로그인 필요 여부처럼
          선생님이 궁금해할 정보가 있으면 함께 적습니다.

          <SectionTitle label="features">주요 기능을 한 문장으로</SectionTitle>

          <FeatureGrid>
            <Feature icon="✨" title="기능 이름">
              기능을 한 줄로 설명합니다.
            </Feature>
            <Feature icon="🎯" title="기능 이름">
              기능을 한 줄로 설명합니다.
            </Feature>
            <Feature icon="📋" title="기능 이름">
              기능을 한 줄로 설명합니다.
            </Feature>
            <Feature icon="🔄" title="기능 이름">
              기능을 한 줄로 설명합니다.
            </Feature>
          </FeatureGrid>

          마무리 문장(선택) — 데이터 보관 방식이나 화면 분위기 등 덧붙일 말이 있으면 적습니다.

  - name: site
    label: 사이트 문구
    type: file
    path: content/site.json
    fields:
      - name: siteName
        label: 사이트 이름
        type: string
      - name: operatorName
        label: 운영자명 (저작권 표기)
        type: string
      - name: siteDescription
        label: 사이트 설명 (검색·공유 미리보기)
        type: string
      - name: contactEmail
        label: 연락 이메일
        type: string
      - name: heroTagline
        label: 홈 태그라인 (분홍 알약)
        type: string
      - name: heroTitle
        label: 홈 큰 제목
        type: string
      - name: heroSubtitle
        label: 홈 부가 문장
        type: string
      - name: heroQuote
        label: 홈 하단 글귀 (비우면 표시 안 함)
        type: string
      - name: heroQuoteSource
        label: 홈 하단 글귀 출처
        type: string
      - name: aboutDescription
        label: About 페이지 설명 (검색·공유 미리보기)
        type: string
      - name: aboutParagraphs
        label: About 소개 문단
        type: text
        list: true
